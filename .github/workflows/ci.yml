name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-repository-contracts:
    name: Docs and repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install contract dependencies
        run: uv sync --locked --group quality

      - name: Compile target Python tree
        run: uv run python -m compileall -q airflow/dags scripts tests

      - name: Validate repository contracts and active legacy guard
        run: >-
          uv run python scripts/ci/check_repository_contracts.py
          --report data/reports/repository-contracts.json

      - name: Validate L4 legacy orphan inventory
        run: >-
          uv run python scripts/ci/check_legacy_orphans.py
          --report data/reports/l4-legacy-orphans.json

      - name: Validate small fixture metadata
        run: >-
          uv run python scripts/utilities/validate_source_contract.py
          --archive tests/fixtures/olist_small/olist_small.zip
          --profile tests/fixtures/olist_small/source_profile_small.json

      - name: Upload repository contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-contracts
          path: |
            data/reports/repository-contracts.json
            data/reports/l4-legacy-orphans.json
          if-no-files-found: warn

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install quality dependencies
        run: uv sync --locked --group quality

      - name: Run Ruff lint
        run: uv run ruff check airflow/dags scripts tests

      - name: Check Ruff formatting
        run: uv run ruff format --check airflow/dags scripts tests

      - name: Run Pyright
        run: uv run pyright

  python-contract-tests:
    name: Python target contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install test dependencies
        run: uv sync --locked --group quality

      - name: Prepare test evidence directory
        run: mkdir -p data/reports

      - name: Run explicit target test collection
        run: >-
          uv run pytest -q
          tests/mysql
          tests/cdc_contracts
          tests/lakehouse_platform
          tests/dbt_clickhouse
          tests/serving
          tests/local_cdc_acceptance
          --junitxml=data/reports/python-contract-tests.xml

      - name: Upload Python JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-contract-tests
          path: data/reports/python-contract-tests.xml
          if-no-files-found: warn

  scala-fast:
    name: Scala fast contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Scala contract image
        env:
          IMAGE: olist-ci-spark-scala:${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker build --progress=plain --target scala-builder
          --tag "$IMAGE" --file docker/spark/Dockerfile .

      - name: Verify JAR content and dependency boundary
        env:
          IMAGE: olist-ci-spark-scala:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run --rm --entrypoint /bin/bash "$IMAGE" -lc '
            set -euo pipefail
            jar=/tmp/streaming/spark/scala/target/scala-2.13/olist-spark-jobs_2.13-0.1.0.jar
            test -s "$jar"
            jar tf "$jar" | grep -q "com/olist/mds/spark/app/BronzeMain.class"
            jar tf "$jar" | grep -q "com/olist/mds/spark/transaction/TransactionState.class"
            ! jar tf "$jar" | grep -qE "^org/apache/(spark|iceberg|kafka|avro)/"
          '

  compose-contract:
    name: Compose target contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ci-compose-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install contract dependencies
        run: uv sync --locked --group quality

      - name: Validate target Compose profile combinations
        run: |
          set -euo pipefail
          docker compose --profile platform --profile streaming config --quiet
          docker compose --profile platform --profile serving config --quiet
          docker compose --profile platform --profile observability config --quiet
          docker compose --profile platform --profile logs config --quiet
          docker compose \
            --profile platform \
            --profile streaming \
            --profile serving \
            --profile observability \
            --profile logs config --quiet

      - name: Validate target observability inventory
        run: uv run python scripts/ci/validate_observability_contract.py

      - name: Clean up Compose resources
        if: always()
        run: docker compose down -v --remove-orphans

  gcp-static-contract:
    name: GCP static contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install static cloud-contract dependencies
        run: uv sync --locked --group quality --group bigquery

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run GCP and parity contract tests
        run: >-
          uv run pytest -q
          tests/gcp
          tests/infrastructure
          tests/airflow/test_gcp_dag_contract.py
          tests/orchestration/test_compose_render.py
          tests/observability/test_gcp_metrics.py

      - name: Parse dbt BigQuery project without online compilation
        run: |
          export DBT_CONTRACT_VARS='{"sync_run_seq": 1, "sync_run_id": "ci-gcp-static-contract"}'
          uv run dbt parse --project-dir dbt/olist_bigquery --profiles-dir dbt/olist_bigquery --no-partial-parse --vars "$DBT_CONTRACT_VARS"

      - name: Validate migration and no-credential parity plans
        run: |
          set -euo pipefail
          uv run python scripts/lab.py gcp migrate status
          uv run python scripts/lab.py parity run --output data/reports/parity-static
          test "$(python -c 'import json; print(json.load(open("data/reports/parity-static/parity.json"))["status"])')" = "BLOCKED"

      - name: Render GCP Compose contour
        run: docker compose --profile core --profile lakehouse-gcp config --quiet

      - name: Validate Terraform without a backend or cloud credentials
        working-directory: infra/gcp/dev
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate observability assets
        run: uv run python scripts/ci/validate_observability_contract.py

      - name: Upload credential-free GCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-static-contract
          path: data/reports/parity-static
          if-no-files-found: warn

  airflow-dag-imports:
    name: Airflow target DAG imports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: ci-airflow-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build target Airflow image
        run: docker compose --profile platform --profile serving build airflow

      - name: Check exact target DAG inventory and imports
        run: >-
          docker compose --profile platform --profile serving run --rm --no-deps
          airflow python scripts/ci/check_airflow_dag_imports.py

      - name: Upload Airflow diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=500 airflow

      - name: Clean up Compose resources
        if: always()
        run: docker compose down -v --remove-orphans

  dbt-clickhouse-static:
    name: dbt ClickHouse static contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DBT_CLICKHOUSE_CONTAINER: ci-dbt-clickhouse-${{ github.run_id }}-${{ github.run_attempt }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/olist_clickhouse
      DBT_TARGET: local_clickhouse
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: olist
      CLICKHOUSE_DATABASE: serving_cdc
      CLICKHOUSE_PASSWORD_FILE: docker/secrets/dev/clickhouse_password.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install Python and dbt dependencies
        run: |
          uv python install
          uv sync --locked --no-dev

      - name: Prepare target dbt profile
        run: cp profiles.yml.example profiles.yml
        working-directory: dbt/olist_clickhouse

      - name: Install target dbt packages
        run: uv run dbt deps --project-dir dbt/olist_clickhouse --profiles-dir dbt/olist_clickhouse

      - name: Start isolated ClickHouse
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$DBT_CLICKHOUSE_CONTAINER" \
            --publish "${CLICKHOUSE_PORT}:8123" \
            --env "CLICKHOUSE_DB=${CLICKHOUSE_DATABASE}" \
            --env "CLICKHOUSE_USER=${CLICKHOUSE_USER}" \
            --env CLICKHOUSE_PASSWORD_FILE=/run/secrets/clickhouse_password \
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/${CLICKHOUSE_PASSWORD_FILE},target=/run/secrets/clickhouse_password,readonly" \
            clickhouse/clickhouse-server:26.3.17.4

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${CLICKHOUSE_PORT}/ping" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$DBT_CLICKHOUSE_CONTAINER"
          exit 1

      - name: Parse and compile target dbt project
        run: |
          set -euo pipefail
          export CLICKHOUSE_PASSWORD="$(tr -d '\r\n' < "$CLICKHOUSE_PASSWORD_FILE")"
          export DBT_CONTRACT_VARS='{"sync_run_seq": 1, "sync_run_id": "ci-static-contract"}'
          uv run dbt parse --project-dir dbt/olist_clickhouse --profiles-dir dbt/olist_clickhouse --no-partial-parse --vars "$DBT_CONTRACT_VARS" --show-all-deprecations
          uv run dbt compile --project-dir dbt/olist_clickhouse --profiles-dir dbt/olist_clickhouse --no-partial-parse --vars "$DBT_CONTRACT_VARS"

      - name: Validate target dbt model/source/selector contract
        run: >-
          uv run python scripts/ci/check_dbt_clickhouse_contract.py
          --report data/reports/dbt-clickhouse-contract.json

      - name: Upload dbt contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-clickhouse-contract
          path: |
            data/reports/dbt-clickhouse-contract.json
            dbt/olist_clickhouse/target/manifest.json
            dbt/olist_clickhouse/target/run_results.json
          if-no-files-found: warn

      - name: Clean up standalone ClickHouse
        if: always()
        run: docker rm --force "$DBT_CLICKHOUSE_CONTAINER" 2>/dev/null || true

  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs:
      - docs-and-repository-contracts
      - python-quality
      - python-contract-tests
      - scala-fast
      - compose-contract
      - gcp-static-contract
      - airflow-dag-imports
      - dbt-clickhouse-static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on failed or skipped required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {
              name: value.get("result")
              for name, value in needs.items()
              if value.get("result") != "success"
          }
          if bad:
              print(json.dumps({"status": "FAIL", "jobs": bad}, sort_keys=True))
              sys.exit(1)
          print(json.dumps({"status": "PASS", "jobs": sorted(needs)}))
          PY
