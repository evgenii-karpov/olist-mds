name: Lakehouse bounded components

on:
  pull_request:
    paths:
      - ".github/workflows/lakehouse-components.yml"
      - "compose.yaml"
      - "docker/**"
      - "streaming/**"
      - "airflow/**"
      - "dbt/olist_clickhouse/**"
      - "scripts/cdc/**"
      - "scripts/serving/**"
      - "scripts/observability/**"
      - "observability/**"
      - "tests/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/lakehouse-components.yml"
      - "compose.yaml"
      - "docker/**"
      - "streaming/**"
      - "airflow/**"
      - "dbt/olist_clickhouse/**"
      - "scripts/cdc/**"
      - "scripts/serving/**"
      - "scripts/observability/**"
      - "observability/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

concurrency:
  group: lakehouse-components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark-image-contract:
    name: Spark image contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build target Spark runtime image
        env:
          IMAGE: olist-ci-spark-runtime:${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker build --progress=plain --target runtime
          --tag "$IMAGE" --file docker/spark/Dockerfile .

      - name: Verify runtime entrypoint, JAR and dependency boundary
        env:
          IMAGE: olist-ci-spark-runtime:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run --rm --entrypoint /usr/local/bin/verify-olist-spark-runtime "$IMAGE"
          docker run --rm --entrypoint /opt/spark/bin/spark-submit "$IMAGE" --version

  cdc-component:
    name: Bounded CDC component
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: ci-cdc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install Python and test dependencies
        run: |
          uv python install
          uv sync --locked --group quality

      - name: Prepare test evidence directory
        run: mkdir -p data/reports

      - name: Prepare Spark status mount
        run: |
          mkdir -p docker/spark/status/bronze docker/spark/status/silver
          rm -f docker/spark/status/bronze/status.json docker/spark/status/silver/status.json
          chmod 0777 docker/spark/status/bronze docker/spark/status/silver

      - name: Run CDC contract tests
        run: >-
          uv run pytest -q tests/mysql tests/cdc_contracts tests/lakehouse_platform
          --junitxml=data/reports/cdc-component-tests.xml

      - name: Bootstrap bounded MySQL to Kafka platform
        run: >-
          uv run python scripts/cdc/local_lab.py bootstrap
          --archive tests/fixtures/olist_small/olist_small.zip
          --run-id ci-cdc-${{ github.run_id }}
          --password-file docker/secrets/dev/mysql_simulator_password.txt
          --timeout 1200
          > data/reports/cdc-bootstrap.json

      - name: Verify Spark status mount is writable
        run: |
          docker run --rm \
            --user 185:185 \
            --entrypoint /bin/sh \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/docker/spark/status,target=/var/run/olist-spark" \
            olist-spark:4.1.3-iceberg1.11.0 \
            -ec 'mkdir -p /var/run/olist-spark/bronze /var/run/olist-spark/silver; printf ready > /var/run/olist-spark/bronze/.write-test; printf ready > /var/run/olist-spark/silver/.write-test; rm -f /var/run/olist-spark/bronze/.write-test /var/run/olist-spark/silver/.write-test'

      - name: Start bounded Spark streaming and wait for readiness
        id: start-cdc-streaming
        run: >-
          uv run python scripts/cdc/local_lab.py start-streaming
          --wait-ready --timeout 300
          > data/reports/cdc-streaming-ready.json

      - name: Start ClickHouse serving observer for catch-up barrier
        run: >-
          uv run python scripts/cdc/local_lab.py start-serving-observer
          > data/reports/cdc-serving-observer.json

      - name: Verify bounded CDC catch-up
        run: >-
          uv run python scripts/cdc/local_lab.py wait-caught-up
          --timeout 900
          > data/reports/cdc-caught-up.json

      - name: Stop bounded streaming services
        if: ${{ always() && steps.start-cdc-streaming.outcome == 'success' }}
        run: >-
          uv run python scripts/cdc/local_lab.py stop-streaming
          > data/reports/cdc-streaming-stop.json

      - name: Restart bounded streaming services
        run: >-
          uv run python scripts/cdc/local_lab.py start-streaming
          --wait-ready --timeout 900
          > data/reports/cdc-streaming-restart.json

      - name: Verify catch-up after bounded restart
        run: >-
          uv run python scripts/cdc/local_lab.py wait-caught-up
          --timeout 900
          > data/reports/cdc-caught-up-after-restart.json

      - name: Capture bounded CDC diagnostics
        if: failure()
        run: |
          docker compose --profile platform --profile streaming --profile serving ps -a \
            > data/reports/cdc-compose-ps.txt || true
          docker compose --profile platform --profile streaming --profile serving logs \
            --no-color --tail=300 spark-bronze spark-silver \
            > data/reports/cdc-spark.log || true
          find docker/spark/status -maxdepth 3 -type f -print \
            > data/reports/cdc-spark-status.txt || true

      - name: Upload CDC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-component
          path: |
            data/reports/cdc-*.json
            data/reports/cdc-*.log
            data/reports/cdc-*.txt
            data/reports/cdc-component-tests.xml
          if-no-files-found: warn

      - name: Clean up CDC Compose resources
        if: always()
        run: docker compose --profile platform --profile streaming --profile serving down -v --remove-orphans

  serving-component:
    name: Bounded serving component
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: ci-serving-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install Python and test dependencies
        run: |
          uv python install
          uv sync --locked --group quality

      - name: Prepare test evidence directory
        run: mkdir -p data/reports

      - name: Prepare Spark status mount
        run: |
          mkdir -p docker/spark/status/bronze docker/spark/status/silver
          rm -f docker/spark/status/bronze/status.json docker/spark/status/silver/status.json
          chmod 0777 docker/spark/status/bronze docker/spark/status/silver

      - name: Run serving contract tests
        run: >-
          uv run pytest -q tests/serving tests/dbt_clickhouse
          --junitxml=data/reports/serving-component-tests.xml

      - name: Bootstrap bounded candidate input
        run: >-
          uv run python scripts/cdc/local_lab.py bootstrap
          --archive tests/fixtures/olist_small/olist_small.zip
          --run-id ci-serving-${{ github.run_id }}
          --password-file docker/secrets/dev/mysql_simulator_password.txt
          --timeout 1200
          > data/reports/serving-bootstrap.json

      - name: Verify Spark status mount is writable
        run: |
          docker run --rm \
            --user 185:185 \
            --entrypoint /bin/sh \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/docker/spark/status,target=/var/run/olist-spark" \
            olist-spark:4.1.3-iceberg1.11.0 \
            -ec 'mkdir -p /var/run/olist-spark/bronze /var/run/olist-spark/silver; printf ready > /var/run/olist-spark/bronze/.write-test; printf ready > /var/run/olist-spark/silver/.write-test; rm -f /var/run/olist-spark/bronze/.write-test /var/run/olist-spark/silver/.write-test'

      - name: Start streaming boundary for serving
        run: >-
          uv run python scripts/cdc/local_lab.py start-streaming
          --wait-ready --timeout 300
          > data/reports/serving-streaming-ready.json

      - name: Start ClickHouse serving observer for catch-up barrier
        run: >-
          uv run python scripts/cdc/local_lab.py start-serving-observer
          > data/reports/serving-observer.json

      - name: Wait for bounded Silver catch-up
        run: >-
          uv run python scripts/cdc/local_lab.py wait-caught-up
          --timeout 900
          > data/reports/serving-caught-up.json

      - name: Start serving runtime
        run: >-
          uv run python scripts/cdc/local_lab.py start-serving
          --build --timeout 1200
          > data/reports/serving-runtime.json

      - name: Execute finite serving sync
        run: >-
          uv run python scripts/cdc/local_lab.py sync-serving
          --run-id ci-serving-sync-${{ github.run_id }}
          --timeout 1800
          > data/reports/serving-sync.json

      - name: Prove finite serving no-op retry
        run: >-
          uv run python scripts/cdc/local_lab.py sync-serving
          --run-id ci-serving-noop-${{ github.run_id }}
          --timeout 1800
          > data/reports/serving-noop.json

      - name: Validate no-op retry result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("data/reports/serving-noop.json").read_text())
          if result.get("status") != "succeeded" or result.get("is_noop") is not True:
              raise SystemExit(f"bounded serving retry was not an authoritative NOOP: {result}")
          PY

      - name: Exercise destructive serving rebuild contract
        run: >-
          uv run python scripts/cdc/local_lab.py rebuild-serving
          --yes --run-id ci-serving-rebuild-${{ github.run_id }}
          --timeout 3000
          > data/reports/serving-rebuild.json

      - name: Exercise bounded maintenance DAG path
        run: >-
          uv run python scripts/cdc/local_lab.py run-maintenance
          --run-id ci-serving-maintenance-${{ github.run_id }}
          --timeout 1800
          > data/reports/serving-maintenance.json

      - name: Capture bounded serving diagnostics
        if: failure()
        run: |
          docker compose --profile platform --profile streaming --profile serving ps -a \
            > data/reports/serving-compose-ps.txt || true
          docker compose --profile platform --profile streaming --profile serving logs \
            --no-color --tail=300 spark-bronze spark-silver \
            > data/reports/serving-spark.log || true
          find docker/spark/status -maxdepth 3 -type f -print \
            > data/reports/serving-spark-status.txt || true

      - name: Upload serving evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serving-component
          path: |
            data/reports/serving-*.json
            data/reports/serving-*.log
            data/reports/serving-*.txt
            data/reports/serving-component-tests.xml
          if-no-files-found: warn

      - name: Clean up serving Compose resources
        if: always()
        run: docker compose --profile platform --profile streaming --profile serving down -v --remove-orphans

  airflow-runtime:
    name: Airflow target runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: ci-airflow-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build target Airflow image
        run: docker compose --profile platform --profile serving build airflow

      - name: Validate target DAG imports and exact inventory
        run: >-
          docker compose --profile platform --profile serving run --rm --no-deps
          airflow python scripts/ci/check_airflow_dag_imports.py

      - name: Start Airflow metadata database
        run: docker compose --profile platform up -d --wait platform-postgres

      - name: Initialize Airflow metadata database
        run: >-
          docker compose --profile platform --profile serving run --rm --no-deps
          airflow airflow db migrate

      - name: Check target Airflow CLI path
        run: >-
          docker compose --profile platform --profile serving run --rm --no-deps
          airflow airflow dags list
          --output table

      - name: Upload Airflow diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=500 airflow

      - name: Clean up Airflow Compose resources
        if: always()
        run: docker compose --profile platform --profile serving down -v --remove-orphans

  observability-contract:
    name: Observability contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ci-observability-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install Python and test dependencies
        run: |
          uv python install
          uv sync --locked --group quality

      - name: Prepare test evidence directory
        run: mkdir -p data/reports

      - name: Validate all target Compose profiles
        run: >-
          docker compose
          --profile platform
          --profile streaming
          --profile serving
          --profile observability
          --profile logs
          config --quiet

      - name: Validate observability contract
        run: uv run python scripts/ci/validate_stage6_configuration.py

      - name: Run observability contract tests
        run: >-
          uv run pytest -q
          tests/observability
          tests/test_stage6_contracts.py
          tests/test_clickhouse_phase7_ci_observability.py
          --junitxml=data/reports/observability-contract-tests.xml

      - name: Validate Prometheus and Alertmanager configuration
        run: |
          docker run --rm --entrypoint promtool \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            prom/prometheus:v3.5.0 \
            check config /workspace/observability/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            prom/alertmanager:v0.30.0 \
            check-config /workspace/observability/alertmanager/alertmanager.yml
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            grafana/alloy:v1.16.1 \
            fmt --test /workspace/observability/alloy/config.alloy

      - name: Upload observability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-contract
          path: data/reports/observability-contract-tests.xml
          if-no-files-found: warn

      - name: Clean up observability Compose resources
        if: always()
        run: >-
          docker compose
          --profile platform
          --profile streaming
          --profile serving
          --profile observability
          --profile logs
          down -v --remove-orphans

  component-summary:
    name: component-summary
    if: ${{ always() }}
    needs:
      - spark-image-contract
      - cdc-component
      - serving-component
      - airflow-runtime
      - observability-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on failed required component jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          event_name = os.environ["EVENT_NAME"]
          optional_manual_jobs = {"cdc-component", "serving-component"}
          bad = {
              name: value.get("result")
              for name, value in needs.items()
              if value.get("result") != "success"
              and not (
                  event_name != "workflow_dispatch"
                  and name in optional_manual_jobs
                  and value.get("result") == "skipped"
              )
          }
          if bad:
              print(json.dumps({"status": "FAIL", "jobs": bad}, sort_keys=True))
              sys.exit(1)
          skipped = sorted(
              name
              for name, value in needs.items()
              if value.get("result") == "skipped"
          )
          print(
              json.dumps(
                  {"status": "PASS", "jobs": sorted(needs), "skipped": skipped},
                  sort_keys=True,
              )
          )
