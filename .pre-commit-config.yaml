repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^docker/spark/status/'

      - id: end-of-file-fixer
        exclude: '^docker/spark/status/'

      - id: check-yaml

      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]

      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        files: '^(airflow/dags|scripts|tests)/.*\.(py|pyi)$'

      - id: dbt-parse
        name: dbt-parse
        entry: >-
          uv run dbt parse --project-dir dbt/olist_clickhouse
          --profiles-dir dbt/olist_clickhouse --target local_clickhouse
          --vars '{"sync_run_seq": 1, "sync_run_id": "pre-commit-parse"}'
          --no-partial-parse --show-all-deprecations
        language: system
        pass_filenames: false
        files: ^dbt/olist_clickhouse/(dbt_project\.yml|profiles\.yml(?:\.example)?|selectors\.yml|models/|macros/|tests/)

      - id: dbt-bigquery-parse
        name: dbt-bigquery-parse
        entry: >-
          uv run dbt parse --project-dir dbt/olist_bigquery
          --profiles-dir dbt/olist_bigquery --target local_static
          --vars '{"sync_run_seq": 1, "sync_run_id": "pre-commit-parse", "build_mode": "initial"}'
          --no-partial-parse --show-all-deprecations
        language: system
        pass_filenames: false
        files: ^dbt/olist_bigquery/(dbt_project\.yml|profiles\.yml|selectors\.yml|models/|macros/|tests/)
