name: "olist_bigquery"
version: "1.0.0"
config-version: 2

profile: "olist_bigquery"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  sync_run_seq: 0
  sync_run_id: ""
  target: "gcp"
  build_mode: "initial"
  previous_boundary_id: ""
  current_boundary_id: ""

models:
  olist_bigquery:
    staging:
      +materialized: ephemeral
    intermediate:
      +materialized: ephemeral
    gold:
      +tags: ["gold_candidate"]
      +on_schema_change: fail
