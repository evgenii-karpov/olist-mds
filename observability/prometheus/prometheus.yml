global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: target-probe
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: mysql
    metrics_path: /probe
    params:
      target: [mysql]
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: kafka
    metrics_path: /probe
    params:
      target: [kafka]
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: kafka-lag
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: kafka-connect
    metrics_path: /probe
    params:
      target: [kafka-connect]
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: apicurio
    metrics_path: /probe
    params:
      target: [apicurio]
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: spark
    metrics_path: /probe
    params:
      target: [spark]
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: spark-streaming
    metrics_path: /probe
    params:
      target: [spark-streaming]
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: polaris
    metrics_path: /probe
    params:
      target: [polaris]
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: airflow
    metrics_path: /probe
    params:
      target: [airflow]
    static_configs:
      - targets: ["target-probe:9108"]

  - job_name: control-postgres
    metrics_path: /probe
    params:
      target: [control-postgres]
    static_configs:
      - targets: ["target-probe:9108"]
