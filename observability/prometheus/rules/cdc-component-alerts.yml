groups:
  - name: lakehouse-target-health
    rules:
      - alert: LakehouseMySQLUnavailable
        expr: olist_target_up{target="mysql"} != 1 or absent(olist_target_up{target="mysql"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target MySQL is unavailable
          runbook: docs/runbooks/cdc-service-restart.md

      - alert: LakehouseKafkaUnavailable
        expr: olist_target_up{target="kafka"} != 1 or absent(olist_target_up{target="kafka"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target Kafka broker is unavailable
          runbook: docs/runbooks/cdc-service-restart.md

      - alert: LakehouseKafkaLagHigh
        expr: sum(olist_kafka_consumer_lag{consumer_group=~"olist-spark-bronze(-.*)?", topic=~"olist_cdc\\.(olist_oltp\\.(customers|orders|order_items|order_payments|order_reviews|products|sellers|product_category_translation)|transaction|heartbeat)"}) > 10000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Target Kafka consumer lag is high
          runbook: docs/runbooks/cdc-kafka-replay.md

      - alert: LakehouseKafkaConnectUnavailable
        expr: olist_target_up{target="kafka-connect"} != 1 or absent(olist_target_up{target="kafka-connect"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target Kafka Connect or MySQL connector is unavailable
          runbook: docs/runbooks/cdc-service-restart.md

      - alert: LakehouseKafkaConnectTaskNotRunning
        expr: olist_connect_task_running{connector="olist-mysql-cdc", task="0"} != 1 or absent(olist_connect_task_running{connector="olist-mysql-cdc", task="0"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target MySQL CDC connector task is not running
          runbook: docs/runbooks/cdc-connector-resnapshot.md

      - alert: LakehouseApicurioUnavailable
        expr: olist_target_up{target="apicurio"} != 1 or absent(olist_target_up{target="apicurio"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target Apicurio Registry is unavailable
          runbook: docs/runbooks/cdc-schema-migration.md

      - alert: LakehouseApicurioCompatibilityUnavailable
        expr: olist_apicurio_compatibility_ready != 1 or absent(olist_apicurio_compatibility_ready)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Target Apicurio compatibility rule is unavailable
          runbook: docs/runbooks/cdc-schema-migration.md

      - alert: LakehouseSparkUnavailable
        expr: olist_target_up{target="spark"} != 1 or absent(olist_target_up{target="spark"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target Spark master or worker is unavailable
          runbook: docs/runbooks/cdc-service-restart.md

      - alert: LakehouseSparkStreamingDegraded
        expr: min(olist_spark_streaming_state{component=~"bronze|silver"}) != 1 or absent(olist_spark_streaming_state{component="bronze"}) or absent(olist_spark_streaming_state{component="silver"}) or (max(olist_spark_streaming_status_stale{component=~"bronze|silver"}) == 1 and olist_lakehouse:kafka_business_consumer_lag > 0)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Target Spark Bronze or Silver progress is degraded
          runbook: docs/runbooks/cdc-service-restart.md

      - alert: LakehouseMinioUnavailable
        expr: up{job="minio"} != 1 or absent(up{job="minio"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target MinIO object storage is unavailable
          runbook: docs/runbooks/cdc-service-restart.md

      - alert: LakehousePolarisUnavailable
        expr: olist_target_up{target="polaris"} != 1 or absent(olist_target_up{target="polaris"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target Polaris catalog is unavailable
          runbook: docs/runbooks/cdc-service-restart.md

      - alert: LakehouseClickHouseUnavailable
        expr: up{job="clickhouse"} != 1 or absent(up{job="clickhouse"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target ClickHouse serving is unavailable
          runbook: docs/runbooks/lakehouse-serving-sync.md

      - alert: LakehouseAirflowUnavailable
        expr: olist_target_up{target="airflow"} != 1 or absent(olist_target_up{target="airflow"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target Airflow API is unavailable
          runbook: docs/runbooks/cdc-service-restart.md

      - alert: LakehouseControlPostgresUnavailable
        expr: olist_target_up{target="control-postgres"} != 1 or absent(olist_target_up{target="control-postgres"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target serving control database is unavailable
          runbook: docs/runbooks/lakehouse-serving-sync.md

  - name: lakehouse-observability-health
    rules:
      - alert: ObservabilityTargetProbeUnavailable
        expr: up{job="target-probe"} != 1 or absent(up{job="target-probe"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Target observability probe is unavailable
          runbook: docs/runbooks/cdc-alert-testing.md

      - alert: ObservabilityPrometheusUnavailable
        expr: up{job="prometheus"} != 1 or absent(up{job="prometheus"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Prometheus is unavailable
          runbook: docs/runbooks/cdc-alert-testing.md

      - alert: ObservabilityAlertmanagerUnavailable
        expr: up{job="alertmanager"} != 1 or absent(up{job="alertmanager"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Alertmanager is unavailable
          runbook: docs/runbooks/cdc-alert-testing.md

      - alert: ObservabilityGrafanaUnavailable
        expr: up{job="grafana"} != 1 or absent(up{job="grafana"})
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Grafana is unavailable
          runbook: docs/runbooks/cdc-alert-testing.md

      - alert: ObservabilityLokiUnavailable
        expr: up{job="loki"} != 1 or absent(up{job="loki"})
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Loki is unavailable
          runbook: docs/runbooks/cdc-alert-testing.md

      - alert: ObservabilityAlloyUnavailable
        expr: up{job="alloy"} != 1 or absent(up{job="alloy"})
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Alloy is unavailable
          runbook: docs/runbooks/cdc-alert-testing.md
