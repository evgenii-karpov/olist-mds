groups:
  - name: lakehouse-target-recordings
    interval: 30s
    rules:
      - record: olist_lakehouse:kafka_consumer_lag
        expr: sum(olist_kafka_consumer_lag{consumer_group=~"olist-spark-bronze(-.*)?", topic=~"olist_cdc\\.(olist_oltp\\.(customers|orders|order_items|order_payments|order_reviews|products|sellers|product_category_translation)|transaction|heartbeat)"})

      - record: olist_lakehouse:kafka_business_consumer_lag
        expr: sum(olist_kafka_consumer_lag{consumer_group=~"olist-spark-bronze(-.*)?", topic=~"olist_cdc\\.olist_oltp\\.(customers|orders|order_items|order_payments|order_reviews|products|sellers|product_category_translation)"})

      - record: olist_lakehouse:spark_streaming_ready
        expr: min(olist_spark_streaming_state{component=~"bronze|silver"})

      - record: olist_lakehouse:spark_streaming_status_stale
        expr: max(olist_spark_streaming_status_stale{component=~"bronze|silver"})

      - record: olist_lakehouse:publication_age_seconds
        expr: olist_serving_publication_age_seconds
